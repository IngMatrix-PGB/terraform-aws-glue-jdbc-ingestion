# Checkov runs on the module only: examples are illustrations (e.g. the
# example SNS topic is unencrypted to keep EventBridge delivery simple).
framework:
  - terraform
skip-path:
  - examples
  - tests
skip-check:
  # Glue security configuration (KMS for S3, CloudWatch and bookmarks) is
  # planned: see docs/TECH-DEBT.md. Remove this skip when it lands.
  - CKV_AWS_195
quiet: true
compact: true
