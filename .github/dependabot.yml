# Weekly, grouped updates so each ecosystem is one PR. Titles are
# Conventional Commits ("chore(deps): ...") so release-please ignores them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]

  # Examples and test roots pin exact provider versions; the module itself
  # uses ranges and does not need bumps.
  - package-ecosystem: terraform
    directories:
      - /examples/minimal
      - /examples/complete
      - /tests/floci
      - /tests/grants
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      terraform:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /tests/python
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      python:
        patterns: ["*"]
