# Weekly, grouped updates so each ecosystem is one PR. Titles are
# Conventional Commits ("chore(deps): ...") so release-please ignores them.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      actions:
        patterns: ["*"]

  # Examples and test roots pin exact provider versions; the module itself
  # uses ranges and does not need bumps.
  - package-ecosystem: terraform
    directories:
      - /examples/minimal
      - /examples/complete
      - /tests/floci
      - /tests/grants
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      terraform:
        patterns: ["*"]

  # The tests mirror the Glue Python shell runtime: Python 3.9
  # (tests/python/.python-version) and the library versions that
  # `--library-set analytics` ships, which the job cannot change. Only the
  # test tooling and pg8000 (installed by the job) move.
  - package-ecosystem: pip
    directory: /tests/python
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    ignore:
      - dependency-name: pyarrow
      - dependency-name: numpy
      - dependency-name: boto3
    groups:
      python:
        patterns: ["*"]
