name: pr-title

# The squash-merge commit takes the PR title, and release-please reads it to
# pick the next version, so the title must be a Conventional Commit.
# pull_request_target only reads the title; it never checks out PR code.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
