name: release-please

# On every push to main, keeps a release PR open with the next version and
# CHANGELOG entries built from Conventional Commits (the squash-merge title).
# Merging that PR tags vX.Y.Z and publishes the GitHub release.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
